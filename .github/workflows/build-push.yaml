name: Build & Push Image

on:
  push:
    branches: [main]
    # Only rebuild when the image contents can actually change
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "agent/**"
      - "chat-ui/**"
      - "vector-db/**"
      - "docs/**"
      - ".github/workflows/build-push.yaml"
  workflow_dispatch: {}

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/middledock-agent

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # EKS nodes are amd64 — a Mac-built arm64 image would CrashLoop
          # with "exec format error". CI builds amd64 natively.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "## Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Pin the SHA tag in k8s manifests — Argo CD deploys exactly what CI built." >> "$GITHUB_STEP_SUMMARY"
